<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maine Waterfront Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="tide" aria-hidden="true"></div><div>
      <h1>Maine Waterfront Explorer</h1>
      <p>NOAA Voices oral histories from Maine fishing and waterfront communities, coded for what people say about change.</p>
    </div></div>
    <form class="search" id="topsearch" role="search"><input id="q" type="search" placeholder="Search what people said, e.g. bait, green crabs, waiting list" aria-label="Search passages"><button class="btn">Search</button></form>
  </div>
</header>
<nav class="tabs" aria-label="Views"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="view"></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="reader" id="reader" hidden aria-label="Passage reader"></aside>

  <script src="data-core.js"></script>
  <script src="data-passages-01.js"></script>
  <script src="data-passages-02.js"></script>
  <script src="data-passages-03.js"></script>

  <script src="data-passages-05.js"></script>

  <script src="data-passages-07.js"></script>
  <script src="data-search-index.js"></script>
  <script src="data-search-eq.js"></script>
  <script src="data-search-wq.js"></script>
  <script src="app.js"></script>
</body>
</html>
