<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High Water Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a reading room with a field notebook beside it. Entry points across the top, one working view below,
   and a passage reader that slides in from the right (full screen on phones). */
:root {
  --bg: #f1f4f3; --surface: #fcfcfb; --ink: #13201e; --ink2: #45514e; --muted: #727e7b;
  --rule: #d4dbd8; --rule2: #e5e9e7; --accent: #0c5a6a; --accent-soft: #dcebee; --accent-ink: #fcfcfb;
  --mark: #fae3a0; --band: rgba(12, 90, 106, .15); --warn-ink: #6f4600; --warn-bg: #fbefd2;
  --c-tucker: #2a78d6; --c-stonewall: #eb6834; --c-grundy: #1baf7a;
  --map-land: #e9eeec; --map-line: #c3ccc9; --map-study: #d3e3e8; --halo: #fcfcfb;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1413; --surface: #161c1b; --ink: #e6ebe9; --ink2: #b3bebb; --muted: #84908d;
    --rule: #2b3533; --rule2: #212927; --accent: #66b8c8; --accent-soft: #15323a; --accent-ink: #0e1413;
    --mark: #5b4a10; --band: rgba(102, 184, 200, .2); --warn-ink: #f0c66a; --warn-bg: #352a10;
    --c-tucker: #3987e5; --c-stonewall: #d95926; --c-grundy: #199e70;
    --map-land: #1a2120; --map-line: #34413e; --map-study: #1d3239; --halo: #161c1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #161c1b; --ink: #e6ebe9; --ink2: #b3bebb; --muted: #84908d;
  --rule: #2b3533; --rule2: #212927; --accent: #66b8c8; --accent-soft: #15323a; --accent-ink: #0e1413;
  --mark: #5b4a10; --band: rgba(102, 184, 200, .2); --warn-ink: #f0c66a; --warn-bg: #352a10;
  --c-tucker: #3987e5; --c-stonewall: #d95926; --c-grundy: #199e70;
  --map-land: #1a2120; --map-line: #34413e; --map-study: #1d3239; --halo: #161c1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-ui); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--rule); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 14px; }
.brand { display: flex; align-items: stretch; gap: 12px; min-width: 0; flex: 1 1 360px; }
.gauge { width: 12px; flex: none; border: 1px solid var(--ink); border-radius: 2px;
  background: repeating-linear-gradient(to bottom, var(--ink) 0 2px, transparent 2px 6px) left / 55% 100% no-repeat,
              repeating-linear-gradient(to bottom, var(--ink) 0 2px, transparent 2px 30px) left / 100% 100% no-repeat; }
.brand h1 { font-size: 27px; font-weight: 700; letter-spacing: .01em; line-height: 1.05; }
.brand p { margin: 3px 0 0; color: var(--ink2); font-size: 14px; }
.search { flex: 1 1 300px; max-width: 460px; display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--bg); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.notice { background: var(--warn-bg); color: var(--warn-ink); font-size: 13.5px; }
.notice .wrap { padding-block: 7px; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 11px 12px 9px; cursor: pointer;
  font-weight: 600; font-size: 15.5px; color: var(--ink2); letter-spacing: .01em; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .ct { font-family: var(--f-mono); font-size: 11.5px; font-weight: 400; color: var(--muted); margin-left: 4px; }
main { padding-block: 22px 60px; }

/* shared pieces */
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { max-width: 72ch; color: var(--ink2); margin: 6px 0 0; font-size: 15.5px; }
.cols { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 18px; }
.cols > * { min-width: 0; }
.cols.places { grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); }
.side { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; padding-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--rule); border-radius: 999px; padding: 1px 9px;
  font-size: 13px; color: var(--ink2); background: var(--surface); white-space: nowrap; line-height: 1.6; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .cid { font-family: var(--f-mono); font-size: 11.5px; }
.flag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--warn-ink); background: var(--warn-bg);
  border-radius: 4px; padding: 2px 8px; }
.flag::before { content: ""; width: 7px; height: 7px; border: 1.5px solid currentColor; transform: rotate(45deg); flex: none; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.tucker { background: var(--c-tucker); } .dot.stonewall { background: var(--c-stonewall); } .dot.grundy { background: var(--c-grundy); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.more { margin-top: 12px; }
.empty { color: var(--muted); padding: 20px 0; }
.method { font-size: 13.5px; color: var(--muted); margin-top: 4px; }

/* passage list items */
.plist { display: grid; gap: 10px; margin-top: 14px; }
.pitem { background: var(--surface); border: 1px solid var(--rule2); border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-align: left; }
.pitem:hover { border-color: var(--rule); box-shadow: 0 1px 0 var(--rule); }
.pitem.sel { border-color: var(--accent); }
.pmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink2); }
.pmeta b { color: var(--ink); font-weight: 600; }
.pmeta .rank { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 1.6em; }
.ptext { font-family: var(--f-read); font-size: 15.5px; line-height: 1.55; margin: 6px 0 0; color: var(--ink); }
.ptext mark, .rtext mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }
.ptags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

/* questions */
.qgroup { margin-top: 14px; }
.qgroup h3 { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.qbtn { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 7px 10px; cursor: pointer;
  font-size: 16px; font-weight: 500; line-height: 1.3; color: var(--ink2); border-radius: 0 var(--r) var(--r) 0; }
.qbtn:hover { background: var(--surface); color: var(--ink); }
.qbtn.on { border-left-color: var(--accent); background: var(--surface); color: var(--ink); }
.qhead h2 { font-size: 26px; font-weight: 600; line-height: 1.15; }
.cardlinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }

/* knowledge cards */
.schema { display: flex; flex-wrap: wrap; gap: 0; margin-top: 16px; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.schema div { padding: 8px 12px; border-right: 1px solid var(--rule2); flex: 1 1 120px; }
.schema div:last-child { border-right: 0; }
.schema b { display: block; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.schema span { font-size: 14px; color: var(--ink2); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; align-items: center; }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 14px; margin-top: 14px; }
.kcard { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.kcard.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.khead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; color: var(--muted); }
.khead .kind { font-weight: 600; letter-spacing: .07em; text-transform: uppercase; font-size: 12px; color: var(--accent); }
.kcard h3 { font-size: 20px; font-weight: 600; line-height: 1.2; }
.kplace { font-size: 14px; color: var(--ink2); }
.kplace .mono { color: var(--muted); }
.quote { margin: 0; font-family: var(--f-read); font-size: 15.5px; line-height: 1.5; border-left: 2px solid var(--rule); padding-left: 12px; }
.quote footer { font-family: var(--f-ui); font-size: 13px; color: var(--muted); margin-top: 3px; }
.quote footer button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
.kfield { font-size: 14px; color: var(--ink2); }
.kfield b { font-weight: 600; color: var(--ink); }
.kask { background: var(--accent-soft); border-radius: 4px; padding: 8px 10px; font-size: 14.5px; }
.kask b { display: block; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.kfoot { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 4px; }

.kstats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 16px; }
.kstats div { display: flex; align-items: baseline; gap: 7px; }
.kstats b { font-size: 30px; font-weight: 600; line-height: 1; }
.kstats span { color: var(--ink2); font-size: 14.5px; }
.kover { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.kover > * { min-width: 0; }
.kpanel { padding: 12px 14px 4px; }
.kpanel .method { margin: 2px 0 0; }
.matrix { width: 100%; max-width: 820px; border-collapse: separate; border-spacing: 2px; font-size: 13.5px; margin: 6px 0 10px; }
.matrix th { font-size: 12px; text-transform: none; letter-spacing: 0; padding: 3px 6px; border: 0; white-space: nowrap; font-weight: 600; color: var(--ink2); }
.matrix td { text-align: center; padding: 4px 6px; border: 0; font-family: var(--f-mono); font-size: 12.5px; cursor: pointer; border-radius: 3px;
  background: color-mix(in srgb, var(--accent) calc(var(--a) * 100%), transparent); color: var(--ink); }
.matrix td.n { background: none; cursor: default; color: var(--muted); }
.matrix td.on, .matrix td:hover { outline: 2px solid var(--ink); }
.mxk { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; color: var(--ink); text-align: left; font-size: 13.5px; }
.mxk:hover, .mxk.on { color: var(--accent); text-decoration: underline; }
.kminis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 6px 10px 12px; }
.kmini { margin: 0; border: 1px solid var(--rule2); border-radius: 4px; overflow: hidden; }
.kmini figcaption { font-size: 14px; font-weight: 600; padding: 5px 8px; color: var(--ink2); display: flex; gap: 6px; align-items: center; }
.kmini figcaption .mono { color: var(--muted); font-weight: 400; }
.kmini svg { display: block; width: 100%; height: auto; }
@media (max-width: 520px) { .kminis { grid-template-columns: minmax(0, 1fr); } }
.cmark { cursor: pointer; stroke-width: 1.6; fill-opacity: .82; }
.cmark.sel { stroke: var(--ink); stroke-width: 2.6; }
.kgroup { margin-top: 26px; }
.kgroup h2 { font-size: 21px; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.kgroup h2 .mono { color: var(--muted); font-size: 13px; font-weight: 400; }
@media (max-width: 980px) { .kover { grid-template-columns: minmax(0, 1fr); } }
/* maps */
.mapbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; }
.county { fill: var(--map-land); stroke: var(--map-line); stroke-width: .7; }
.county.study { fill: var(--map-study); }
.maplabel { font-family: var(--f-ui); font-size: 14px; fill: var(--ink2); paint-order: stroke; stroke: var(--halo); stroke-width: .25em; stroke-linejoin: round; pointer-events: none; }
.maplabel.state { font-size: 15px; letter-spacing: .2em; fill: var(--muted); font-weight: 600; }
.maplabel.county { font-size: 13px; fill: var(--muted); font-style: italic; }
.ptmark { stroke: var(--surface); stroke-width: 1.6; cursor: pointer; }
.ptmark.sel { stroke: var(--ink); stroke-width: 2.4; }
.ivmark { stroke: var(--ink); stroke-width: 1.4; }
.mapfoot { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--rule2); font-size: 13px; color: var(--muted); }
.plrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 8px; border-bottom: 1px solid var(--rule2); cursor: pointer; border-radius: 4px; }
.plrow:hover { background: var(--surface); }
.plrow.on { background: var(--accent-soft); }
.plrow .nm { font-weight: 600; }
.plrow .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.plrow .n { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink2); }
.filterbox { width: 100%; font: inherit; padding: 7px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); color: var(--ink); margin: 10px 0 6px; }

/* meaning map */
.mm { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr); gap: 24px; margin-top: 18px; align-items: start; }
.mm > * { min-width: 0; }
.pt { stroke: var(--surface); stroke-width: .9; cursor: pointer; }
.pt.dim { opacity: .12; }
.tlabel { font-family: var(--f-ui); font-size: 15px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.trow { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 6px; border-bottom: 1px solid var(--rule2); cursor: pointer; border-radius: 4px; }
.trow:hover { background: var(--surface); }
.trow.on { background: var(--accent-soft); }
.trow .tid { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.trow .tl { font-size: 14.5px; overflow-wrap: anywhere; }
.mbar { display: flex; width: 64px; height: 8px; gap: 1px; }
.mbar i { display: block; height: 100%; border-radius: 1px; }

/* codes */
.crow { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule2); padding: 9px 8px; cursor: pointer; border-radius: 4px; }
.crow:hover { background: var(--surface); }
.crow.on { background: var(--accent-soft); }
.crow .l1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.crow .cid { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); min-width: 2.4em; }
.crow .cn { font-weight: 600; font-size: 15.5px; }
.crow .l2 { font-size: 13px; color: var(--muted); margin-left: calc(2.4em + 8px); }
.defbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; margin-top: 12px; display: grid; gap: 6px; font-size: 14.5px; color: var(--ink2); }
.defbox b { color: var(--ink); }

/* interviews */
.tablewrap { overflow-x: auto; margin-top: 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th { text-align: left; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--rule2); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--bg); }
td.n { font-family: var(--f-mono); font-size: 13px; text-align: right; }
.ivhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; }
.ivhead h2 { font-size: 28px; font-weight: 600; }
.stripbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); margin-top: 16px; padding: 12px 14px 8px; }
.stripscroll { overflow-x: auto; }
.strip text { font-family: var(--f-ui); font-size: 13px; fill: var(--ink2); }
.strip .tick { stroke: var(--ink2); }
.strip .col:hover { fill: var(--band); }
.seqlist { margin-top: 18px; display: grid; gap: 0; }
.seq { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--rule2); }
.seq.flash { background: var(--accent-soft); }
.seq .sn { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); padding-top: 3px; text-align: right; }
.seq .qq { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
.seq .aa { font-family: var(--f-read); font-size: 16px; line-height: 1.6; margin: 0; max-width: 75ch; }
.seq .tg { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

/* reader */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 15, .28); z-index: 40; }
.reader { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 48vw); background: var(--surface); border-left: 1px solid var(--rule); z-index: 50;
  display: flex; flex-direction: column; box-shadow: -12px 0 30px rgba(0, 0, 0, .08); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.rbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule2); }
.rbar .sp { flex: 1; font-size: 13.5px; color: var(--muted); }
.rbody { overflow: auto; padding: 16px 20px 40px; display: grid; gap: 14px; align-content: start; }
.rname { font-size: 23px; font-weight: 600; line-height: 1.15; }
.rname button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.rname button:hover { text-decoration-color: var(--accent); }
.rq { font-size: 15px; color: var(--ink2); border-left: 2px solid var(--rule); padding-left: 10px; }
.rq b { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: block; font-weight: 600; }
.rtext { font-family: var(--f-read); font-size: 17px; line-height: 1.65; margin: 0; }
.wrapchips .chip { white-space: normal; text-align: left; line-height: 1.3; padding: 4px 10px; border-radius: 12px; }
a.plc { color: inherit; text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: pointer; }
a.plc:hover, a.plc:focus-visible { color: var(--accent); text-decoration-style: solid; }
.rsec b.h { display: block; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.prov { background: var(--bg); border-radius: var(--r); padding: 12px 14px; font-size: 14px; color: var(--ink2); display: grid; gap: 6px; }
